# GoonHub Development Configuration
# Used for local development outside of Docker
#
# For Docker development, secrets can be set via environment variables:
#   - GOONHUB_DATABASE_PASSWORD
#   - GOONHUB_AUTH_PASETO_SECRET (auto-generated if empty in dev)
#   - GOONHUB_AUTH_ADMIN_PASSWORD
#   - GOONHUB_MEILISEARCH_API_KEY
#   - GOONHUB_PORNDB_API_KEY (optional)

environment: development

server:
  port: "8080"
  read_timeout: 15s
  write_timeout: 0s           # Disabled for video streaming
  idle_timeout: 60s
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
  # TLS disabled in development
  tls_cert_file: ""
  tls_key_file: ""
  trusted_proxies: []
  # secure_cookies: false     # Default: false in development

database:
  host: localhost
  port: 5432
  user: goonhub
  password: goonhub_dev_password
  dbname: goonhub
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5

log:
  level: debug      # debug, info, warn, error
  format: console   # json, console

auth:
  paseto_secret: ""                   # Auto-generated in development if empty
  admin_username: admin
  admin_password: admin               # Change this!
  token_duration: 24h
  login_rate_limit: 10                # requests per minute
  login_rate_burst: 5                 # burst size
  lockout_threshold: 5                # failed attempts before lockout
  lockout_duration: 15m               # how long account is locked
  lockout_cleanup_freq: 5m            # cleanup interval for old lockout entries

meilisearch:
  host: "http://localhost:7700"
  api_key: goonhub_dev_master_key
  index_name: "videos"

processing:
  frame_interval: 10
  max_frame_dimension: 320
  max_frame_dimension_large: 1280
  frame_quality: 85
  frame_quality_lg: 85
  frame_quality_sprites: 75
  metadata_workers: 3
  thumbnail_workers: 1
  sprites_workers: 1
  thumbnail_seek: "00:00:05"
  video_dir: "./data/videos"
  metadata_dir: "./data/metadata"
  frame_output_dir: "./data/metadata/frames"
  thumbnail_dir: "./data/metadata/thumbnails"
  sprite_dir: "./data/metadata/sprites"
  vtt_dir: "./data/metadata/vtt"
  actor_image_dir: "./data/metadata/actors"
  studio_logo_dir: "./data/metadata/studios"
  marker_thumbnail_dir: "./data/metadata/marker-thumbnails"
  grid_cols: 12
  grid_rows: 8
  sprites_concurrency: 4              # Use 4 cores for local dev
  job_history_retention: "30d"          # completed and cancelled jobs ("0" = keep forever)
  job_history_failed_retention: "90d"   # failed and timed out jobs ("0" = keep forever)
  job_history_purge_interval: 1h
  job_history_purge_batch_size: 5000
  metadata_timeout: 5m
  thumbnail_timeout: 2m
  sprites_timeout: 30m

porndb:
  api_key: ""                         # Optional, for metadata fetching

shutdown:
  graceful_timeout: 30s               # total shutdown time
  job_completion_wait: 15s            # wait for running jobs
  orphan_timeout: 30s                 # orphan detection threshold
  stuck_pending_time: 10m             # pending job stuck threshold

pagination:
  max_items_per_page: 100             # maximum items per page for all paginated endpoints

streaming:
  max_global_streams: 100             # total concurrent streams allowed
  max_streams_per_ip: 10              # per-IP limit
  buffer_size: 262144                 # 256KB buffer for streaming
  path_cache_ttl: 5m                  # cache scene paths for 5 minutes
  path_cache_max_size: 10000          # max cached entries
  # On-the-fly conversion of the files browsers can't play (AVI, MPEG-2, MKV, HEVC, WMV...)
  # into H.264 + AAC fragmented MP4 (CPU ffmpeg). H.264/AAC in another container is only
  # remuxed. Admins can turn it off in Settings > App > Advanced.
  transcode:
    max_concurrent: 4         # ffmpeg conversions at the same time (viewers of cached parts need none)
    preset: veryfast          # libx264 preset
    crf: 23                   # libx264 quality (lower is better, 18-28 is sensible)
    max_height: 1080          # downscale above 1080p (smaller side), 0 keeps the size
    audio_bitrate: 160k       # AAC bitrate of re-encoded audio
    threads: 0                # ffmpeg threads per conversion, 0 = auto
    keyframe_interval: 2      # seconds between keyframes (MP4 fragment length)
    # Converted output kept on disk: replays, seeks back and other viewers of a part
    # already converted don't run ffmpeg again. Its own directory in GoonHub's data (never
    # a media folder: it deletes the files it wrote there).
    cache:
      enabled: true
      dir: ./data/transcode-cache
      max_size_gb: 20         # least recently used conversions are removed above this
      max_age: 24h            # conversions unused for this long are removed
      cleanup_interval: 10m   # also done at startup
      read_ahead: 60s         # how far a conversion may run ahead of its viewer
      idle_timeout: 30s       # a conversion nobody watches stops after this (or when its slot is needed)

# Dedicated share server (optional)
# Runs a second HTTP listener serving only share-related routes.
# Useful for exposing share links on a separate public domain while
# keeping the main app behind a VPN.
# sharing:
#   base_url: "http://localhost:8081"  # Public URL for share links
#   port: "8081"                       # Port for the share server (empty = disabled)
