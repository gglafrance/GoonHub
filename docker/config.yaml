# GoonHub Production Configuration
# Copy this file and customize for your deployment
#
# Secrets should be set via environment variables:
#   - GOONHUB_DATABASE_PASSWORD
#   - GOONHUB_AUTH_PASETO_SECRET (must be exactly 32 bytes)
#   - GOONHUB_AUTH_ADMIN_PASSWORD (min 12 chars, uppercase, lowercase, digit)
#   - GOONHUB_MEILISEARCH_API_KEY
#   - GOONHUB_PORNDB_API_KEY (optional)

environment: production

server:
  port: "8080"
  read_timeout: 30s
  write_timeout: 0s       # Disabled for video streaming (streams can be hours long)
  idle_timeout: 120s
  # Comma-separated list of allowed origins for CORS
  allowed_origins:
    - "https://your-domain.com"
  # TLS configuration (optional - use if not behind a reverse proxy)
  # tls_cert_file: "/path/to/cert.pem"
  # tls_key_file: "/path/to/key.pem"
  # Trusted proxies for X-Forwarded-For (CIDR ranges)
  trusted_proxies:
    - "172.16.0.0/12"     # Docker networks
    - "10.0.0.0/8"        # Private networks
    - "127.0.0.1"         # Localhost
  # Override Secure flag on cookies (default: true in production)
  # secure_cookies: true

database:
  host: postgres
  port: 5432
  user: goonhub
  # password: set via GOONHUB_DATABASE_PASSWORD env var
  dbname: goonhub
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5

log:
  level: info       # debug, info, warn, error
  format: json      # json, console

auth:
  # paseto_secret: set via GOONHUB_AUTH_PASETO_SECRET env var (must be exactly 32 bytes)
  admin_username: admin
  # admin_password: set via GOONHUB_AUTH_ADMIN_PASSWORD env var
  # Session lifetime (login token and cookie). Units: h, m, s, d (days), y (365 days).
  # Env: GOONHUB_AUTH_TOKEN_DURATION. Logging out still ends the session at once.
  token_duration: 24h
  login_rate_limit: 10        # requests per minute
  login_rate_burst: 5         # burst size
  lockout_threshold: 5        # failed attempts before lockout
  lockout_duration: 15m       # how long account is locked
  lockout_cleanup_freq: 5m    # cleanup interval for old lockout entries

meilisearch:
  host: "http://meilisearch:7700"
  # api_key: set via GOONHUB_MEILISEARCH_API_KEY env var
  index_name: "videos"

processing:
  frame_interval: 10
  max_frame_dimension: 320
  max_frame_dimension_large: 1280
  frame_quality: 85
  frame_quality_lg: 85
  frame_quality_sprites: 75
  metadata_workers: 3
  thumbnail_workers: 1
  sprites_workers: 1
  thumbnail_seek: "00:00:05"
  video_dir: "/app/data/videos"
  metadata_dir: "/app/data/metadata"
  frame_output_dir: "/app/data/metadata/frames"
  thumbnail_dir: "/app/data/metadata/thumbnails"
  sprite_dir: "/app/data/metadata/sprites"
  vtt_dir: "/app/data/metadata/vtt"
  actor_image_dir: "/app/data/metadata/actors"
  studio_logo_dir: "/app/data/metadata/studios"
  marker_thumbnail_dir: "/app/data/metadata/marker-thumbnails"
  grid_cols: 12
  grid_rows: 8
  sprites_concurrency: 0      # 0 = auto (based on CPU cores)
  job_history_retention: "30d"          # completed and cancelled jobs ("0" = keep forever)
  job_history_failed_retention: "90d"   # failed and timed out jobs ("0" = keep forever)
  job_history_purge_interval: 1h
  job_history_purge_batch_size: 5000
  failing_threshold: 3                 # failures in a row on an unchanged file before "missing" runs and auto retries skip it (0 = never)
  metadata_timeout: 5m
  thumbnail_timeout: 2m
  sprites_timeout: 30m

porndb:
  # api_key: set via GOONHUB_PORNDB_API_KEY env var (optional)

shutdown:
  graceful_timeout: 30s       # total shutdown time
  job_completion_wait: 15s    # wait for running jobs
  orphan_timeout: 30s         # orphan detection threshold
  stuck_pending_time: 10m     # pending job stuck threshold

pagination:
  max_items_per_page: 100     # maximum items per page for all paginated endpoints

social:                       # docs/SOCIAL.md (0 = unlimited)
  friend_requests_per_hour: 30  # friend requests a user can send per hour
  follows_per_hour: 60          # follows a user can make per hour
  max_pending_requests: 50      # pending outgoing friend requests per user

profiles:                       # docs/PROFILES.md
  image_dir: "/app/data/metadata/profiles"  # avatars and banners (GoonHub data, never a media directory)
  max_upload_bytes: 8388608     # largest avatar or banner upload (8 MB)
  max_image_pixels: 25000000    # largest decoded image (width x height)
  image_uploads_per_hour: 20    # per user (0 = unlimited)
  max_showcase_items: 4         # favorite videos / markers per showcase (1-12)
  bio_max_length: 1000          # characters
  display_name_max_length: 64   # characters (64 at most)

streaming:
  max_global_streams: 100     # total concurrent streams allowed
  max_streams_per_ip: 10      # per-IP limit
  buffer_size: 262144         # 256KB buffer for streaming
  path_cache_ttl: 5m          # cache scene paths for 5 minutes
  path_cache_max_size: 10000  # max cached entries
  # On-the-fly conversion of the files browsers can't play (AVI, MPEG-2, MKV, HEVC, WMV...)
  # into H.264 + AAC fragmented MP4 (CPU ffmpeg). H.264/AAC in another container is only
  # remuxed. Admins can turn it off in Settings > App > Advanced.
  transcode:
    max_concurrent: 4         # ffmpeg conversions at the same time (viewers of cached parts need none)
    preset: veryfast          # libx264 preset
    crf: 23                   # libx264 quality (lower is better, 18-28 is sensible)
    max_height: 1080          # downscale above 1080p (smaller side), 0 keeps the size
    audio_bitrate: 160k       # AAC bitrate of re-encoded audio
    threads: 0                # ffmpeg threads per conversion, 0 = auto
    keyframe_interval: 2      # seconds between keyframes (MP4 fragment length)
    # Converted output kept on disk: replays, seeks back and other viewers of a part
    # already converted don't run ffmpeg again. Its own directory in GoonHub's data (never
    # a media folder: it deletes the files it wrote there).
    cache:
      enabled: true
      dir: ./data/transcode-cache
      max_size_gb: 20         # least recently used conversions are removed above this
      max_age: 24h            # conversions unused for this long are removed
      cleanup_interval: 10m   # also done at startup
      read_ahead: 60s         # how far a conversion may run ahead of its viewer
      idle_timeout: 30s       # a conversion nobody watches stops after this (or when its slot is needed)

library_health:
  stat_concurrency: 8         # files stat'ed at once by the health page checks (keep low on NFS)

# Dedicated share server (optional)
# Runs a second HTTP listener serving only share-related routes.
# Expose on a separate public domain (e.g., share.your-domain.com) while
# keeping the main app behind a VPN.
# Env vars: GOONHUB_SHARING_BASE_URL, GOONHUB_SHARING_PORT
# sharing:
#   base_url: "https://share.your-domain.com"
#   port: "8081"
